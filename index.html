<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a BiblioLend - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- Panel izquierdo -->
      <div class="panel-left">
        <div class="panel-left__deco"></div>
        <div class="panel-left__content">
          <img
            src="./imagenes/bibliolend_new_logo.png"
            alt="Logo BiblioLend"
            class="logo-img"
            width="90"
            height="90"
          />
          <h1 class="brand-title">BiblioLend</h1>
          <p class="brand-tagline">
            Accede al catálogo escolar, libros y recursos académicos de tu
            institución educativa, todo en un solo lugar.
          </p>
        </div>
        <div class="panel-left__footer">
          <p>&copy; 2026 BiblioLend · CodeForge</p>
        </div>
      </div>

      <!-- Panel derecho -->
      <div class="panel-right">
        <div class="form-wrapper">
          <p class="form-brand">Inicia Sesión con tu cuenta de BiblioLend</p>
          <h2 class="form-title">¡Bienvenido!</h2>
          <p class="form-sub"></p>
          <form action="enviar()" id="iniciarSesion">
            <div class="field-group">
              <label for="rol">Tipo de Usuario</label>
              <select class="field-select" id="rol" name="rol" required>
                <option value="" disabled>Selecciona tu rol</option>
                <option value="estudiante" selected>Estudiante</option>
                <option value="bibliotecario">Bibliotecario</option>
                <option value="administrador">Administrador</option>
              </select>
            </div>

            <div class="field-group">
              <label for="email">Correo Institucional</label>
              <input
                class="field-input"
                type="email"
                id="email"
                name="email"
                required
                placeholder="usuario@institucion.edu.co"
              />
            </div>

            <div class="field-group">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                class="field-input"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" class="btn btn-login">
              Entrar al Sistema
            </button>
          </form>
          
          <p class="forgot">
            <a href="#">¿Olvidaste tu contraseña? Haz clic aquí</a>
          </p>
        </div>
      </div>
    </div>
    <script src="./JS/practica.js">
      // Nuestro JavaScript
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
