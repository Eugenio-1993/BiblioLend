<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <title>Bienvenido a BiblioLend - Iniciar Sesión</title>
  </head>
  <body>
    <header>
      <img src="./imagenes/bibliolend_logo_V0.1.png" alt="Logo BiblioLend" />
      <h1>BiblioLend</h1>
      <p>Identifícate para acceder a la biblioteca digital</p>
    </header>

    <main>
      <form>
        <label for="email">Correo Institucional: </label>
        <br />
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="usuario@colegio.edu.co"
        />
        <br /><br />
        <label for="password">Contraseña:</label>
        <br />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        />
        <br /><br />
        <input type="submit" value="Entrar al Sistema" />
      </form>
    </main>

    <footer>
      <p>&copy; 2026 CodeForge - Colegio República de Honduras</p>
    </footer>
  </body>
</html>
