<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a BiblioLend - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link 
      rel="stylesheet" 
      href="./css/index.css" 
    />
  </head>
  <body>
    <header class="text-center py-4">
      <img
        src="./imagenes/bibliolend_new_logo.png"
        alt="Logo BiblioLend"    
        class="imgPrincipal"
        width="155"
        height="155"
      />
      <h1 class="h1_titulo--bibliolend">BiblioLend</h1>
      <p class="p_descripcion--bibliolend">Inicia sesión para acceder a la biblioteca digital</p>
    </header>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          <form id="loginForm" class="formulario card shadow-sm p-4">
            <div class="mb-3">
              <label for="rol" class="form-label">Tipo de usuario:</label>
              <select id="rol" name="rol" class="estilosInputs form-control" required>
                <option value="" selected disabled>Selecciona una opción</option>
                <option value="estudiante">Estudiante</option>
                <option value="administrador">Administrador</option>
                <option value="bibliotecario">Bibliotecario</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Institucional:</label>
              <input
                type="email"
                id="email"
                name="email"
                class="estilosInputs form-control"
                required
                placeholder="usuario@ierepublicadehonduras.edu.co"
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña:</label>
              <input
                type="password"
                id="password"
                name="password"
                class="estilosInputs form-control"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>

            <div class="d-grid">
              <input
                type="submit"
                value="Iniciar Sesión"
                class="btn btn-success"
              />
            </div>
          </form>
        </div>
      </div>
    </main>

    <hr />

    <footer class="text-center py-3">
      <p>
        <strong>BiblioLend</strong> - La mejor herramienta para acceder al
        catálogo escolar.
      </p>
      <p>&copy; 2026 BiblioLend, By CodeForge - Todos los derechos reservados</p>
      <p>Institución Educativa República de Honduras</p>
    </footer>

    <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const rol = document.getElementById("rol").value;

        if (rol === "estudiante") {
          window.location.href = "./pages/panel_principal.html";
        } else if (rol === "administrador") {
          window.location.href = "./pages/panel_administrador.html";
        } else if (rol === "bibliotecario") {
          window.location.href = "./pages/panel_bibliotecario.html";
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
