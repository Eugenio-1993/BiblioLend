<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a BiblioLend - Iniciar Sesión</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header class="text-center py-4">
      <img
        src="./imagenes/Bibliolend_newLogo_b7ls3gb7ls3gb7ls.png"
        alt="Logo BiblioLend"
        class="img-principal"
        width="155"
        height="155"
      />
      <h1>BiblioLend</h1>
      <p>Identifícate e inicia sesión para acceder a la biblioteca digital</p>
    </header>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          <form class="card shadow-sm p-4">
            <div class="mb-3">
              <label for="email" class="form-label"
                >Correo Institucional:</label
              >
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
                placeholder="usuario@institucion.edu.co"
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña:</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Contraseña_Ejemplo"
                required
              />
            </div>

            <div class="d-grid">
              <input
                type="submit"
                value="Entrar al Sistema"
                class="btn btn-success"
              />
            </div>
          </form>
        </div>
      </div>
    </main>
    <hr />

    <footer class="text-center py-3">
      <hr>
        <p>
        <strong>BiblioLend</strong> - La mejor herramienta para acceder al
        catálogo escolar.
        </p>
      <p>&copy; 2026 BiblioLend, By CodeForge - Todos los derechos reservados</p>
      <p>Institución Educativa República de Honduras</p>
    </footer>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
